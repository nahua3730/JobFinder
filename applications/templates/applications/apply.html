{% extends "base.html" %}
{% block title %}Apply{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>
  .cr-theme {
    font-family: 'VT323', monospace;
    font-size: 1.5rem;
    color: #333;
    background-color: #795548;
    padding: 20px;
    border: 8px solid #3e2723;
    border-radius: 8px;
  }

  .cr-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
    background-color: #aad751;
    border: 6px solid #8cbf3f;
    padding: 15px;
    box-shadow: 0px 8px 0px #3e2723;
    gap: 12px;
    flex-wrap: wrap;
  }

  .cr-title {
    text-transform: uppercase;
    color: #fff;
    text-shadow: 3px 3px 0px #333;
    font-size: 2.8rem;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .cr-subtitle {
    color: #f5f5f5;
    font-size: 1.4rem;
    margin-top: 8px;
    text-transform: uppercase;
  }

  .cr-panel {
    background: #f5f1e6;
    border: 8px solid #3e2723;
    padding: 20px;
    margin-bottom: 20px;
  }

  .cr-label {
    display: block;
    text-transform: uppercase;
    margin-bottom: 8px;
    font-size: 1.5rem;
  }

  .cr-btn {
    display: inline-block;
    padding: 8px 20px;
    font-family: 'VT323', monospace;
    font-size: 1.5rem;
    text-transform: uppercase;
    text-decoration: none;
    color: #000;
    background-color: #fff;
    border: 4px solid #000;
    border-bottom: 8px solid #000;
    cursor: pointer;
    transition: transform 0.1s, border-bottom-width 0.1s;
  }

  .cr-btn:active {
    transform: translateY(4px);
    border-bottom: 4px solid #000;
  }

  .cr-btn-primary {
    background-color: #00a8f3;
    color: white;
  }

  .cr-btn-secondary {
    background-color: #ffcc00;
    color: black;
  }

  @media (max-width: 768px) {
    .cr-title {
      font-size: 2.1rem;
    }

    .cr-subtitle {
      font-size: 1.2rem;
    }
  }
</style>

<div class="container mt-4 cr-theme">

  <div class="cr-header">
    <div>
      <h1 class="cr-title">
        <svg width="64" height="64" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="1" y="6" width="2" height="2" fill="#ff9800"/>
          <rect x="5" y="1" width="4" height="2" fill="#e53935"/>
          <rect x="7" y="3" width="2" height="1" fill="#e53935"/>
          <rect x="3" y="3" width="8" height="10" fill="#ffffff"/>
          <rect x="4" y="4" width="2" height="2" fill="#000000"/>
          <rect x="5" y="8" width="4" height="3" fill="#dddddd"/>
          <rect x="4" y="13" width="2" height="2" fill="#ff9800"/>
          <rect x="8" y="13" width="2" height="2" fill="#ff9800"/>
          <rect x="11" y="4" width="2" height="9" fill="#cccccc"/>
          <rect x="3" y="13" width="8" height="1" fill="#cccccc"/>
        </svg>
        APPLY
      </h1>
      <div class="cr-subtitle">
        {{ job.title }}
      </div>
    </div>
  </div>

  <div class="cr-panel">
    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="cr-label">Tailored Note (Optional)</label>
        {{ form.note }}
      </div>

      <div class="d-flex gap-2 flex-wrap mt-4">
        <button class="cr-btn cr-btn-primary" type="submit">
          {% if application %}Update Application{% else %}Apply{% endif %}
        </button>

        <a class="cr-btn cr-btn-secondary" href="{% url 'jobs:job_detail' job.id %}">
          Cancel
        </a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
