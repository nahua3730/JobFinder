{% extends "base.html" %}
{% block title %}Apply{% endblock %}

{% block content %}
<div class="container mt-4 cr-theme">

  <div class="cr-header">
    <div>
      <h1 class="cr-title">
        <svg width="64" height="64" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="1" y="6" width="2" height="2" fill="#ff9800"/>
          <rect x="5" y="1" width="4" height="2" fill="#e53935"/>
          <rect x="7" y="3" width="2" height="1" fill="#e53935"/>
          <rect x="3" y="3" width="8" height="10" fill="#ffffff"/>
          <rect x="4" y="4" width="2" height="2" fill="#000000"/>
          <rect x="5" y="8" width="4" height="3" fill="#dddddd"/>
          <rect x="4" y="13" width="2" height="2" fill="#ff9800"/>
          <rect x="8" y="13" width="2" height="2" fill="#ff9800"/>
          <rect x="11" y="4" width="2" height="9" fill="#cccccc"/>
          <rect x="3" y="13" width="8" height="1" fill="#cccccc"/>
        </svg>
        APPLY
      </h1>
      <div class="cr-subtitle">
        {{ job.title }}
      </div>
    </div>
  </div>

  <div class="cr-panel">
    <form method="post" class="crossy-apply-form">
      {% csrf_token %}

      <div class="crossy-note-card">
        <div class="crossy-note-top">
          <div class="crossy-note-stamp">✉</div>

          <div class="crossy-note-heading-wrap">
            <h2 class="crossy-note-heading">TAILORED NOTE</h2>
            <p class="crossy-note-desc">
              Leave a short message to make your application feel more personal.
            </p>
          </div>
        </div>

        <div class="crossy-note-inner">
          <label for="tailored_note" class="crossy-note-label">
            Recruiter Message
            <span class="crossy-note-optional">OPTIONAL</span>
          </label>

          <textarea
            id="tailored_note"
            name="tailored_note"
            class="crossy-note-input"
            placeholder="Hi! I’m excited about this role because..."
          >{% if application and application.tailored_note %}{{ application.tailored_note }}{% elif request.POST.tailored_note %}{{ request.POST.tailored_note }}{% endif %}</textarea>
        </div>

        <div class="crossy-note-buttons">
          <button type="submit" class="update-send-btn">
            <div class="update-send-svg-wrapper-1">
              <div class="update-send-svg-wrapper">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  width="24"
                  height="24"
                >
                  <path fill="none" d="M0 0h24v24H0z"></path>
                  <path
                    fill="currentColor"
                    d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l6-8-8 6-8.054-2.685z"
                  ></path>
                </svg>
              </div>
            </div>
            <span>{% if application %}UPDATE APPLICATION{% else %}APPLY{% endif %}</span>
          </button>


          <a href="{% url 'jobs:job_detail' job.id %}" class="crossy-btn crossy-btn-cancel">
            CANCEL
          </a>
        </div>
      </div>
    </form>
  </div>

</div>
{% endblock %}
