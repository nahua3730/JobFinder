{% extends "base.html" %}
{% block title %}Update Candidate Stage{% endblock %}

{% block content %}
<div class="container py-4">
  <h1 class="h4 mb-3">Update Stage</h1>

  <div class="mb-3">
    <div><b>Applicant:</b> {{ application.applicant.username }}</div>
    <div><b>Job:</b> {{ application.job.title }}</div>
  </div>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-dark" type="submit">Save</button>
    <a class="btn btn-outline-secondary" href="{% url 'applications:recruiter_pipeline' %}">Back</a>
  </form>
</div>
{% endblock %}
