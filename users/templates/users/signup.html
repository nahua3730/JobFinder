{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<div class="container mt-5 cr-theme">

  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="cr-header text-center">
        <h2 class="cr-title">
          <svg width="64" height="64" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" class="me-2">
            <rect x="1" y="6" width="2" height="2" fill="#ff9800"/>
            <rect x="5" y="1" width="4" height="2" fill="#e53935"/>
            <rect x="7" y="3" width="2" height="1" fill="#e53935"/>
            <rect x="3" y="3" width="8" height="10" fill="#ffffff"/>
            <rect x="4" y="4" width="2" height="2" fill="#000000"/>
            <rect x="5" y="8" width="4" height="3" fill="#dddddd"/>
            <rect x="4" y="13" width="2" height="2" fill="#ff9800"/>
            <rect x="8" y="13" width="2" height="2" fill="#ff9800"/>
            <rect x="11" y="4" width="2" height="9" fill="#cccccc"/>
            <rect x="3" y="13" width="8" height="1" fill="#cccccc"/>
          </svg>
          CREATE ACCOUNT
        </h2>
      </div>

      <div class="cr-panel">
        <form method="post">
          {% csrf_token %}

          <div class="row g-3">
            {{ form.as_p }}
          </div>

          <div class="mt-4 text-center">
            <button type="submit" class="cr-btn cr-btn-primary w-100">
              Sign Up
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>

</div>

{% endblock %}
