{% extends "base.html" %}
{% block title %}Edit Recruiter Profile{% endblock %}

{% block content %}
<div class="arcade-page">

  <div class="arcade-frame">
    <div class="arcade-banner">
      <h1 class="arcade-title">EDIT RECRUITER PROFILE</h1>
      <p class="arcade-subtitle">Update your recruiter and company information</p>
    </div>

    <div class="arcade-panel">
      <form method="post" class="arcade-form">
        {% csrf_token %}

        <h2 class="arcade-section-title">NAME</h2>
        <div class="arcade-form-fields">
          {{ user_form.as_p }}
        </div>

        <h2 class="arcade-section-title mt-4">COMPANY</h2>
        <div class="arcade-form-fields">
          {{ profile_form.as_p }}
        </div>

        <div class="arcade-actions mt-4">
          <button class="btn arcade-btn arcade-btn-blue" type="submit">Save</button>
          <a class="btn arcade-btn arcade-btn-gray" href="{% url 'users:recruiter_profile' %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
