{% extends "base.html" %}
{% block title %}Recruiter Profile{% endblock %}

{% block content %}
<style>
  .recruiter-profile-card {
    background: #fff8dc;
    border: 6px solid #333;
    box-shadow: 0px 6px 0px #3e2723;
    overflow: hidden;
  }

  .recruiter-profile-row {
    padding: 18px 20px;
    border-bottom: 4px solid #d3c39a;
  }

  .recruiter-profile-row:last-child {
    border-bottom: 0;
  }

  .recruiter-profile-label {
    display: block;
    margin-bottom: 8px;
    font-size: 1.45rem;
    text-transform: uppercase;
    color: #5a3320;
  }

  .recruiter-profile-value {
    font-size: 1.55rem;
    line-height: 1.35;
    color: #1f160e;
    overflow-wrap: anywhere;
  }

  .recruiter-profile-actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .recruiter-profile-actions .cr-btn {
    transform: none;
    min-height: 46px;
    padding: 12px 18px;
    font-size: 0.7rem;
  }

  .recruiter-profile-actions .cr-btn::before {
    transform: translateY(6px);
  }

  .recruiter-profile-actions .cr-btn:hover {
    transform: translateY(-2px);
  }

  .recruiter-profile-actions .cr-btn:hover::before {
    transform: translateY(4px);
  }

  .recruiter-profile-actions .cr-btn:active {
    transform: translateY(2px);
  }

  .recruiter-profile-actions .cr-btn:active::before {
    transform: translateY(2px);
  }
</style>

<div class="container mt-4 cr-theme">
  <div class="cr-header">
    <h2 class="cr-title">
      <svg width="64" height="64" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" class="me-3" aria-hidden="true">
        <rect x="1" y="6" width="2" height="2" fill="#ff9800"/>
        <rect x="5" y="1" width="4" height="2" fill="#e53935"/>
        <rect x="7" y="3" width="2" height="1" fill="#e53935"/>
        <rect x="3" y="3" width="8" height="10" fill="#ffffff"/>
        <rect x="4" y="4" width="2" height="2" fill="#000000"/>
        <rect x="5" y="8" width="4" height="3" fill="#dddddd"/>
        <rect x="4" y="13" width="2" height="2" fill="#ff9800"/>
        <rect x="8" y="13" width="2" height="2" fill="#ff9800"/>
        <rect x="11" y="4" width="2" height="9" fill="#cccccc"/>
        <rect x="3" y="13" width="8" height="1" fill="#cccccc"/>
      </svg>
      Recruiter Profile
    </h2>

    <div class="recruiter-profile-actions">
      <a href="{% url 'users:recruiter_profile_edit' %}" class="cr-btn cr-btn-primary">Edit Profile</a>
    </div>
  </div>

  <div class="recruiter-profile-card">
    <div class="recruiter-profile-row">
      <span class="recruiter-profile-label">Name</span>
      <div class="recruiter-profile-value">{{ request.user.get_full_name|default:request.user.username }}</div>
    </div>

    <div class="recruiter-profile-row">
      <span class="recruiter-profile-label">Title</span>
      <div class="recruiter-profile-value">{{ profile.title|default:"—" }}</div>
    </div>

    <div class="recruiter-profile-row">
      <span class="recruiter-profile-label">Company</span>
      <div class="recruiter-profile-value">{{ profile.company_name|default:"—" }}</div>
    </div>
  </div>
</div>
{% endblock %}
