{% extends "base.html" %}
{% block title %}Recruiter Profile{% endblock %}

{% block content %}
<style>
</style>

<div class="container mt-4 cr-theme">
  <div class="cr-header">
    <h2 class="cr-title">
      <svg width="64" height="64" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" class="me-3" aria-hidden="true">
        <rect x="1" y="6" width="2" height="2" fill="#ff9800"/>
        <rect x="5" y="1" width="4" height="2" fill="#e53935"/>
        <rect x="7" y="3" width="2" height="1" fill="#e53935"/>
        <rect x="3" y="3" width="8" height="10" fill="#ffffff"/>
        <rect x="4" y="4" width="2" height="2" fill="#000000"/>
        <rect x="5" y="8" width="4" height="3" fill="#dddddd"/>
        <rect x="4" y="13" width="2" height="2" fill="#ff9800"/>
        <rect x="8" y="13" width="2" height="2" fill="#ff9800"/>
        <rect x="11" y="4" width="2" height="9" fill="#cccccc"/>
        <rect x="3" y="13" width="8" height="1" fill="#cccccc"/>
      </svg>
      Recruiter Profile
    </h2>

    <div class="recruiter-profile-actions cr-btn-group">
      <a href="{% url 'users:recruiter_profile_edit' %}" class="cr-btn cr-btn-primary">Edit Profile</a>
    </div>
  </div>

  <div class="cr-detail-card">
    <div class="recruiter-profile-row cr-detail-row">
      <span class="recruiter-profile-label cr-detail-label">Name</span>
      <div class="recruiter-profile-value cr-detail-value">{{ request.user.get_full_name|default:request.user.username }}</div>
    </div>

    <div class="recruiter-profile-row cr-detail-row">
      <span class="recruiter-profile-label cr-detail-label">Title</span>
      <div class="recruiter-profile-value cr-detail-value">{{ profile.title|default:"—" }}</div>
    </div>

    <div class="recruiter-profile-row cr-detail-row">
      <span class="recruiter-profile-label cr-detail-label">Company</span>
      <div class="recruiter-profile-value cr-detail-value">{{ profile.company_name|default:"—" }}</div>
    </div>
  </div>
</div>
{% endblock %}
