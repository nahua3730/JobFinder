{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

<style>
#applicantClusterMap {
  height: 650px;
  border: 8px solid #333;
  border-radius: 8px;
  overflow: hidden;
}

.stat-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.stat-card {
  background: #aad751;
  border: 6px solid #8cbf3f;
  padding: 12px 18px;
  font-family: 'VT323', monospace;
  font-size: 1.4rem;
}

.stat-label {
  font-size: 1rem;
}

.stat-value {
  font-size: 1.6rem;
}

.leaflet-div-icon.cr-map-marker {
  background: transparent !important;
  border: none !important;
}

.cr-map-sprite {
  width: 34px;
  height: 34px;
  background-repeat: no-repeat;
  background-size: contain;
  background-position: center;
  image-rendering: pixelated;
  filter: drop-shadow(2px 2px 0px #000);
}

.cr-map-egg {
  background-image: url("/static/img/egg.png");
}
</style>

<div class="container mt-4 cr-theme">

  <div class="cr-header">
    <h2 class="cr-title">
      <svg width="64" height="64" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" class="me-3">
        <rect x="1" y="6" width="2" height="2" fill="#ff9800"/>
        <rect x="5" y="1" width="4" height="2" fill="#e53935"/>
        <rect x="7" y="3" width="2" height="1" fill="#e53935"/>
        <rect x="3" y="3" width="8" height="10" fill="#ffffff"/>
        <rect x="4" y="4" width="2" height="2" fill="#000000"/>
        <rect x="5" y="8" width="4" height="3" fill="#dddddd"/>
        <rect x="4" y="13" width="2" height="2" fill="#ff9800"/>
        <rect x="8" y="13" width="2" height="2" fill="#ff9800"/>
        <rect x="11" y="4" width="2" height="9" fill="#cccccc"/>
        <rect x="3" y="13" width="8" height="1" fill="#cccccc"/>
      </svg>
      APPLICANT MAP
    </h2>
  </div>

  <div class="stat-row">
    <div class="stat-card">
      <div class="stat-label">JOB</div>
      <div class="stat-value">{{ job.title }}</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">CLUSTERS</div>
      <div class="stat-value">ON</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">APPLICANTS</div>
      <div class="stat-value" id="applicantCount">0</div>
    </div>
  </div>

  <div id="applicantClusterMap"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>
const map = L.map("applicantClusterMap").setView([39.8283, -98.5795], 4);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors",
  maxZoom: 19,
}).addTo(map);

const clusterGroup = L.markerClusterGroup();
const bounds = [];
const applicantCount = document.getElementById("applicantCount");

const eggIcon = L.divIcon({
  className: "cr-map-marker",
  html: "<div class='cr-map-sprite cr-map-egg'></div>",
  iconSize: [34, 34],
  iconAnchor: [17, 17],
  popupAnchor: [0, -16],
});

fetch("{% url 'jobs:recruiter_applicant_map_data' job.id %}")
  .then(response => response.json())
  .then(data => {
    applicantCount.textContent = data.length;

    data.forEach(applicant => {
      const marker = L.marker([applicant.latitude, applicant.longitude], { icon: eggIcon });

      marker.bindPopup(`
        <div style="min-width:240px;">
          <h6 style="font-weight:700; margin-bottom:8px;">${applicant.name}</h6>
          ${applicant.headline ? `<div><strong>Headline:</strong> ${applicant.headline}</div>` : ""}
          ${applicant.location ? `<div><strong>Location:</strong> ${applicant.location}</div>` : ""}
          ${applicant.skills ? `<div><strong>Skills:</strong> ${applicant.skills}</div>` : ""}
        </div>
      `);

      clusterGroup.addLayer(marker);
      bounds.push([applicant.latitude, applicant.longitude]);
    });

    map.addLayer(clusterGroup);

    if (bounds.length > 0) {
      map.fitBounds(bounds, { padding: [40, 40] });
    }
  })
  .catch(error => {
    console.error("Failed to load applicant map data:", error);
  });
</script>

{% endblock %}
